server {
    listen 8002;
    server_name _;
    client_max_body_size 12m;
    charset utf-8;

    # Refresh Docker DNS when the app container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /static/ {
        alias /srv/static/;
        add_header X-Content-Type-Options nosniff always;
    }

    location /media/ {
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        set $django http://app:8002;
        proxy_pass $django;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Caddy already terminates HTTPS; using $scheme here causes redirects.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
